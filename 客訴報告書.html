<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>客訴報告書</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;background:#e9ecef;font-family:"Microsoft JhengHei",Arial,sans-serif;font-size:12px;color:#000}
    .toolbar{position:sticky;top:0;z-index:2;display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:center;padding:10px;background:#fff;border-bottom:1px solid #ccc}
    button{height:34px;padding:0 14px;border:1px solid #999;background:#fff;display:inline-flex;align-items:center;cursor:pointer}
    button.primary{background:#111827;color:#fff;border-color:#111827}
    .status{position:absolute;right:24px;font-weight:700;color:#1f4f8f}
    main{padding:24px;overflow-x:auto}
    .sheet{width:794px;margin:0 auto;background:#fff;box-shadow:0 12px 30px rgba(15,23,42,.18);padding-bottom:30px}
    .title{height:26px;display:flex;align-items:end;justify-content:center;font-size:20px;font-family:"DFKai-SB","PMingLiU",serif;margin-bottom:8px}
    .title small{font:700 12px "Microsoft JhengHei";color:red;margin-left:8px}
    table{width:100%;border-collapse:collapse;table-layout:fixed;border:1px solid #111}
    td{border:1px solid #111;padding:0;vertical-align:middle;overflow:hidden}
    .label,.sig{text-align:center;font-weight:700;background:#fff}
    .left{padding-left:4px;font-weight:700}
    .field{background:#d7d7d7}
    .white{background:#fff}
    .top td{height:23px}
    .tall td{height:54px}
    .mid td{height:40px}
    .short td{height:21px}
    .section td{height:20px;text-align:center;font-weight:700}
    .feedback td{height:222px}
    .fix td{height:64px}
    .compensation td{height:64px}
    .decision td{height:80px}
    .review td{height:50px}
    .signature td{height:40px}
    .vlabel{width:70px;text-align:center;font-weight:700;padding:8px 4px}
    .hint{display:block;margin-top:4px;color:red;line-height:1.15}
    .edit,.line{width:100%;min-height:100%;padding:4px 6px;outline:none;white-space:pre-wrap;word-break:break-word}
    .inline{display:inline-block;min-width:120px;min-height:18px;padding:0 2px;outline:none;font-weight:400}
    .edit:focus,.line:focus,.inline:focus{box-shadow:inset 0 0 0 2px #2563eb;background:#eef5ff}
    .choices{display:grid;gap:4px;padding:4px 6px;font-weight:700}
    .choices label{display:flex;gap:2px;align-items:center;white-space:nowrap}
    input[type=checkbox]{width:12px;height:12px;margin:0}
    .bluegray{background:#c7d0dc}
    
    /* 日曆輸入框樣式 */
    .line-date{width:100%;height:100%;border:none;background:transparent;padding:4px 6px;outline:none;font-family:inherit;font-size:inherit}
    .line-date:focus{box-shadow:inset 0 0 0 2px #2563eb;background:#eef5ff}
    .inline-date{border:1px solid #ccc;padding:2px 4px;outline:none;font-family:inherit;font-size:inherit;font-weight:normal}
    .inline-date:focus{border-color:#2563eb;box-shadow:0 0 0 2px rgba(37,99,235,0.2)}
    
    @media print{
      .toolbar{display:none}
      main{padding:0}
      .sheet{width:100%;box-shadow:none;padding-bottom:0}
    }
  </style>
</head>
<body>
  <div class="toolbar">
    <button class="primary" id="saveReport" type="button">儲存報告</button>
    
    <input type="file" id="uploadFile" style="display: none;">
    <button type="button" id="triggerUpload">📎 選擇附件</button>
    <span id="fileLabel" style="font-size:12px; color:#555; max-width:150px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;"></span>
    
    <button type="button" onclick="window.print()">列印</button>
    <button type="button" id="clearForm">清空</button>
    <span id="status" class="status"></span>
  </div>
  <main>
    <section class="sheet">
      <div class="title">客訴報告書<small>(灰色區域必填)</small></div>
      <table>
        <colgroup>
          <col style="width:70px"><col style="width:90px"><col style="width:90px">
          <col style="width:95px"><col style="width:87px"><col style="width:87px">
          <col style="width:91px"><col style="width:82px"><col style="width:101px">
        </colgroup>
        <tbody>
          <tr class="top">
            <td colspan="3" class="left">填呈日期：<input type="text" id="reportDate" class="inline-date" data-field="填呈日期" style="width: 140px;" readonly></td>
            <td colspan="6" class="left">門市客訴案件：<span id="store" class="inline" contenteditable="true" data-field="門市"></span></td>
          </tr>
          <tr class="tall">
            <td class="label">客名</td>
            <td colspan="2" class="field"><div id="customerName" class="line" contenteditable="true" data-field="客戶名字"></div></td>
            <td class="label">購買型號</td>
            <td colspan="2" class="field"><div class="line" contenteditable="true" data-field="購買型號"></div></td>
            <td class="label">原因</td>
            <td colspan="2" class="field">
              <div class="choices">
                <label>退機 <input type="checkbox" data-choice="退機"></label>
                <label>維修 <input type="checkbox" data-choice="維修"></label>
                <label>料件 <input type="checkbox" data-choice="料件"></label>
                <label>其他 <input type="checkbox" data-choice="其他"></label>
              </div>
            </td>
          </tr>
          <tr class="mid">
            <td class="label">客代</td>
            <td colspan="2" class="field"><div id="customerCode" class="line" contenteditable="true" data-field="客戶代號"></div></td>
            <td class="label">裝機日期</td>
            <td colspan="2" class="field"><input type="date" class="line-date" data-field="裝機日期"></td>
            <td class="label">客戶反應日期</td>
            <td colspan="2" class="field"><input type="date" class="line-date" data-field="客戶反應日期"></td>
          </tr>
          <tr class="short">
            <td class="label">電話</td>
            <td colspan="2" class="field"><div class="line" contenteditable="true" data-field="電話"></div></td>
            <td class="label">購買價格</td>
            <td colspan="2" class="field"><div class="line" contenteditable="true" data-field="購買價格"></div></td>
            <td class="label">承諾賠償日期</td>
            <td colspan="2" class="field"><input type="date" class="line-date" data-field="承諾賠償日期"></td>
          </tr>
          <tr class="section"><td class="label">日期</td><td colspan="8" class="label">案件經過</td></tr>
          <tr class="feedback">
            <td class="vlabel">報告書內容<span class="hint">(依照時間順序登至客戶收資料區)</span></td>
            <td colspan="8" class="field"><div class="edit" contenteditable="true" data-field="報告書內容"></div></td>
          </tr>
          <tr class="compensation">
            <td class="vlabel">補償內容</td>
            <td colspan="8" class="field"><div class="edit" contenteditable="true" data-field="補償內容"></div></td>
          </tr>
          <tr class="fix">
            <td class="vlabel">客戶訴求</td>
            <td colspan="8" class="field"><div class="edit" contenteditable="true" data-field="客戶訴求"></div></td>
          </tr>
          <tr class="decision">
            <td class="vlabel">門市判斷<br>(含證)</td>
            <td colspan="8" class="field"><div class="edit" contenteditable="true" data-field="門市判斷"></div></td>
          </tr>
          <tr>
            <td class="vlabel">責任人</td>
            <td colspan="8" class="bluegray"><div class="line" contenteditable="true" data-field="負責人"></div></td>
          </tr>
          <tr class="review">
            <td class="vlabel">品保建議</td>
            <td colspan="8" class="white"><div class="edit" contenteditable="true" data-field="品保建議"></div></td>
          </tr>
          <tr class="review">
            <td class="vlabel">客服建議</td>
            <td colspan="8" class="white"><div class="edit" contenteditable="true" data-field="客服建議"></div></td>
          </tr>
          <tr class="review">
            <td class="vlabel">備註</td>
            <td colspan="8" class="white"><div class="edit" contenteditable="true" data-field="備註"></div></td>
          </tr>
          <tr class="signature">
            <td class="sig">製單者</td>
            <td colspan="3" class="field"><div class="line" contenteditable="true" data-field="製單者"></div></td>
            <td class="sig">回電者</td>
            <td colspan="4" class="field"><div class="line" contenteditable="true" data-field="回電者"></div></td>
          </tr>
        </tbody>
      </table>
    </section>
  </main>
  
  <script>
    const $ = id => document.getElementById(id);
    const statusEl = $('status');
    
    // ==========================================
    // 自動填入 YYYYMMDD HHMMSS 時間格式
    // ==========================================
    function autoFillDate() {
      const now = new Date();
      const pad = n => String(n).padStart(2, '0');
      const y = now.getFullYear();
      const m = pad(now.getMonth() + 1);
      const d = pad(now.getDate());
      const h = pad(now.getHours());
      const min = pad(now.getMinutes());
      const s = pad(now.getSeconds());
      $('reportDate').value = `${y}${m}${d} ${h}${min}${s}`;
    }
    autoFillDate(); 

    // ==========================================
    // 檔案選取與 Base64 轉換處理
    // ==========================================
    let fileData = null;
    let fileName = '';
    let mimeType = '';

    $('triggerUpload').onclick = () => $('uploadFile').click();

    $('uploadFile').addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) {
        $('fileLabel').textContent = '';
        fileData = null;
        return;
      }
      $('fileLabel').textContent = file.name;
      const reader = new FileReader();
      reader.onload = function(ev) {
        fileData = ev.target.result.split(',')[1];
        fileName = file.name;
        mimeType = file.type;
      };
      reader.readAsDataURL(file);
    });

    function val(id) {
      const e = $(id);
      return e.tagName === 'INPUT' ? e.value : e.textContent.trim();
    }
    
    function fields() {
      const o = {};
      document.querySelectorAll('[data-field]').forEach(e => {
        o[e.dataset.field] = e.tagName === 'INPUT' ? e.value : e.textContent.trim();
      });
      o['原因'] = Array.from(document.querySelectorAll('[data-choice]:checked'))
        .map(x => x.dataset.choice)
        .join('、');
      return o;
    }
    
    $('clearForm').onclick = () => {
      document.querySelectorAll('[contenteditable=true]').forEach(e => e.textContent = '');
      document.querySelectorAll('input[type=checkbox]').forEach(e => e.checked = false);
      document.querySelectorAll('input[type=date]').forEach(e => e.value = '');
      
      autoFillDate();
      $('uploadFile').value = '';
      $('fileLabel').textContent = '';
      fileData = null;
      statusEl.textContent = '';
    };
    
    $('saveReport').onclick = async () => {
      statusEl.textContent = '儲存與上傳中，請稍候...';
      
      const payload = {
        date: val('reportDate'),
        store: val('store'),
        customerCode: val('customerCode'),
        customerName: val('customerName'),
        fields: fields(),
        fileName: fileName,
        mimeType: mimeType,
        fileData: fileData
      };
      
      const miss = [];
      if (!payload.date) miss.push('填呈日期');
      if (!payload.store) miss.push('門市');
      if (!payload.customerCode) miss.push('客代');
      if (!payload.customerName) miss.push('客名');
      
      if (miss.length) {
        statusEl.textContent = '請填寫：' + miss.join('、');
        return;
      }
      
      try {
        // ★★★ 請替換成你重新部署後取得的最新 GAS Web App 網址 ★★★
        const scriptURL = 'https://script.google.com/macros/s/AKfycbwcQIn7hf81ySm2MrQZYOJmr6wCEU6T9r44kCl9j0LHNPcARCB-XiYoull8RJ5NXNBgmw/exec';
        
        await fetch(scriptURL, {
          method: 'POST',
          mode: 'no-cors', 
          headers: {
            'Content-Type': 'text/plain;charset=utf-8' 
          },
          body: JSON.stringify(payload)
        });
        
        statusEl.textContent = '送出成功！請至試算表確認資料是否寫入。';
        
        // 可選：成功後清空表單
        // $('clearForm').click();
        
      } catch (e) {
        statusEl.textContent = '發生錯誤，請檢查網路狀態';
        console.error(e);
      }
    };
  </script>
</body>
</html>
