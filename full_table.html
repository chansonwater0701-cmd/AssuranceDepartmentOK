    // ==========================================
    // 4. 動態生成 HTML 表格
    // ==========================================
    window.onload = function() {
        const thead = document.getElementById('table-head');
        const tbody = document.getElementById('table-body');
        
        // 渲染標題列 (3層)
        let tr1 = document.createElement('tr');
        let tr2 = document.createElement('tr');
        let tr3 = document.createElement('tr');
        
        let thTop = document.createElement('th');
        thTop.rowSpan = 3;
        thTop.style.backgroundColor = '#ccc';
        thTop.textContent = '功能與檢核項目';
        tr1.appendChild(thTop);

        headers.forEach(brand => {
            // 第一層: 品牌
            let thBrand = document.createElement('th');
            let totalCols = brand.categories.reduce((sum, cat) => sum + cat.items.length, 0);
            thBrand.colSpan = totalCols;
            thBrand.className = brand.cssClass;
            thBrand.textContent = brand.brand;
            tr1.appendChild(thBrand);

            brand.categories.forEach(cat => {
                // 第二層: 服務項目
                let thCat = document.createElement('th');
                thCat.colSpan = cat.items.length;
                thCat.className = 'cat-bg';
                thCat.textContent = cat.name;
                tr2.appendChild(thCat);

                cat.items.forEach(item => {
                    // 第三層: 服務細項/機型
                    let thItem = document.createElement('th');
                    thItem.className = 'item-bg';
                    thItem.textContent = item.name;
                    tr3.appendChild(thItem);
                });
            });
        });

        thead.appendChild(tr1);
        thead.appendChild(tr2);
        thead.appendChild(tr3);

        // 渲染資料列 (打勾)
        fields.forEach(field => {
            let tr = document.createElement('tr');
            let tdLabel = document.createElement('td');
            tdLabel.textContent = field.name;
            tr.appendChild(tdLabel);

            headers.forEach(brand => {
                brand.categories.forEach(cat => {
                    cat.items.forEach(item => {
                        let td = document.createElement('td');
                        let config = dataMatrix[item.id] || "";
                        // 如果該欄位 ID 存在於配置字串中，印出打勾符號
                        if (config.split(',').includes(field.id)) {
                            td.innerHTML = '<span class="check-mark">●</span>';
                        }
                        tr.appendChild(td);
                    });
                });
            });
            tbody.appendChild(tr);
        });
    };
</script>
