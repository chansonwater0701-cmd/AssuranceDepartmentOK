<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>維修技師工具 — 千山 ／ 惟品 ／ 全戶</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
:root{
  --primary:#1a56db;--surface:#f0f4f8;--border:#dde3ed;
  --text-main:#1e293b;--text-muted:#64748b;--accent:#dc2626;
  --warning-bg:#fffbeb;--warning-border:#fcd34d;--warning-text:#92400e;
}
*{box-sizing:border-box}
body{background:var(--surface);color:var(--text-main);font-family:'Segoe UI',system-ui,-apple-system,sans-serif;margin:0}

/* HEADER */
.site-header{background:linear-gradient(135deg,#1e3a8a 0%,#1a56db 100%);color:#fff;padding:14px 16px 12px;position:sticky;top:0;z-index:1000;box-shadow:0 2px 16px rgba(30,58,138,.35)}
.header-top{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.site-header h1{font-size:1.25rem;font-weight:800;margin:0;letter-spacing:-.02em}
.site-header .subtitle{font-size:.75rem;opacity:.7;margin-top:2px}
.search-wrap{position:relative}
.search-wrap input{width:100%;padding:10px 14px 10px 40px;border-radius:10px;border:2px solid rgba(255,255,255,.25);background:rgba(255,255,255,.15);color:#fff;font-size:.95rem;outline:none;transition:.2s}
.search-wrap input::placeholder{color:rgba(255,255,255,.6)}
.search-wrap input:focus{background:rgba(255,255,255,.22);border-color:rgba(255,255,255,.55)}
.search-icon{position:absolute;left:12px;top:50%;transform:translateY(-50%);font-size:1rem;opacity:.75;pointer-events:none}
.result-count{margin-top:6px;font-size:.78rem;opacity:.8;min-height:16px}

/* CONTENT */
.content-wrap{max-width:960px;margin:0 auto;padding:20px 14px 50px}

/* BRAND SECTION */
.brand-section{margin-bottom:36px}
.brand-header{display:flex;align-items:center;gap:10px;padding:12px 16px;border-radius:12px;margin-bottom:12px;color:#fff;font-weight:800;font-size:1rem}
.brand-header.qs{background:linear-gradient(135deg,#1e3a8a,#1a56db)}
.brand-header.wp{background:linear-gradient(135deg,#065f46,#059669)}
.brand-header.qh{background:linear-gradient(135deg,#7e22ce,#9333ea)}
.brand-header .brand-badge{background:rgba(255,255,255,.25);font-size:.75rem;font-weight:700;padding:2px 10px;border-radius:10px;margin-left:auto}

/* MACHINE PILLS */
.machine-pills{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.machine-pill{padding:5px 13px;border-radius:20px;border:1.5px solid var(--border);background:#fff;font-size:.82rem;font-weight:600;cursor:pointer;color:var(--text-muted);transition:.15s}
.machine-pill.qs-pill.active{background:#1a56db;color:#fff;border-color:#1a56db}
.machine-pill.wp-pill.active{background:#059669;color:#fff;border-color:#059669}
.machine-pill.qs-pill:hover:not(.active){border-color:#1a56db;color:#1a56db}
.machine-pill.wp-pill:hover:not(.active){border-color:#059669;color:#059669}

/* REPAIR ITEMS */
.repair-item{background:#fff;border:1.5px solid var(--border);border-radius:12px;margin-bottom:7px;overflow:hidden;transition:box-shadow .15s}
.repair-item:hover{box-shadow:0 3px 12px rgba(0,0,0,.08)}
.repair-header{display:flex;align-items:center;padding:11px 13px;cursor:pointer;gap:9px;user-select:none}
.repair-code{color:#fff;font-size:.77rem;font-weight:700;padding:3px 9px;border-radius:6px;white-space:nowrap;min-width:44px;text-align:center;flex-shrink:0}
.repair-code.qs{background:#1a56db}
.repair-code.wp{background:#059669}
.repair-code.qh{background:#9333ea}
.repair-machine-badge{background:#e0e7ff;color:#3730a3;font-size:.72rem;font-weight:700;padding:2px 7px;border-radius:5px;flex-shrink:0}
.repair-symptom{flex:1;font-weight:600;font-size:.88rem;line-height:1.35}
.chevron{color:var(--text-muted);font-size:1rem;transition:transform .2s;flex-shrink:0}
.repair-item.open .chevron{transform:rotate(180deg)}
.repair-body{display:none;border-top:1.5px solid var(--border)}
.repair-item.open .repair-body{display:block}
.repair-section{padding:11px 13px;border-bottom:1px solid var(--border)}
.repair-section:last-child{border-bottom:none}
.sec-label{font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--text-muted);margin-bottom:7px}
.checks-box{font-size:.84rem;line-height:1.75;white-space:pre-wrap;background:#f8fafc;border-left:3px solid var(--primary);border-radius:0 8px 8px 0;padding:10px 12px;color:var(--text-main)}
.checks-box.wp{border-left-color:#059669}
.checks-box.qh{border-left-color:#9333ea}
.parts-wrap{display:flex;flex-wrap:wrap;gap:6px}
.part-tag{background:var(--warning-bg);color:var(--warning-text);border:1px solid var(--warning-border);font-size:.79rem;font-weight:600;padding:3px 10px;border-radius:16px}
.cat-bar{background:#f1f5f9;color:#475569;font-size:.78rem;font-weight:700;padding:5px 13px;border-bottom:1px solid var(--border);letter-spacing:.03em}
.keyword-highlight{color:var(--accent);font-weight:700}
.empty-state{text-align:center;padding:32px 18px;color:var(--text-muted);font-size:.9rem}
.empty-state .icon{font-size:2rem;margin-bottom:6px}

/* QUANHU */
.quanhu-item{background:#fff;border:1.5px solid var(--border);border-radius:10px;margin-bottom:7px;padding:11px 13px}
.quanhu-cause{font-size:.84rem;font-weight:600;color:var(--text-main);margin-bottom:5px}
.quanhu-sol{font-size:.82rem;color:#6b21a8;font-weight:600;background:#faf5ff;border-left:3px solid #9333ea;padding:7px 10px;border-radius:0 6px 6px 0}

/* ANCHOR JUMP BUTTONS */
.jump-bar{display:flex;gap:8px;padding:10px 14px;background:#fff;border-bottom:2px solid var(--border);position:sticky;top:var(--header-h,110px);z-index:900;flex-wrap:wrap}
.jump-btn{padding:5px 16px;border-radius:20px;border:none;font-size:.82rem;font-weight:700;cursor:pointer;transition:.15s}
.jump-btn.qs{background:#e8f0fe;color:#1a56db}
.jump-btn.wp{background:#d1fae5;color:#065f46}
.jump-btn.qh{background:#f3e8ff;color:#7e22ce}
.jump-btn:hover{opacity:.8}
</style>
</head>
<body>

<header class="site-header" id="siteHeader">
  <div class="header-top">
    <span style="font-size:1.8rem">🔧</span>
    <div>
      <h1>維修技師工具</h1>
      <div class="subtitle">千山 ／ 惟品 ／ 全戶軟水 · 機台異常情形、維修建議</div>

  <div class="search-wrap">
    <span class="search-icon">🔍</span>

<div class="jump-bar">

  <button class="jump-btn wp" onclick="document.getElementById('sec-wp').scrollIntoView({behavior:'smooth'})">💧 惟品</button>
  <button class="jump-btn qh" onclick="document.getElementById('sec-qh').scrollIntoView({behavior:'smooth'})">🌊 全戶軟水</button>

<div class="content-wrap">

  <!-- 惟品 -->
  <div class="brand-section" id="sec-wp">

    </div>
    <div class="machine-pills" id="wp-pills">
      <button class="machine-pill wp-pill active" data-machine="all" onclick="filterMachine(this,'wp')">全部機台</button>
    </div>
    <div id="wp-list"></div>
  </div>

  <!-- 全戶軟水 -->
  <div class="brand-section" id="sec-qh">
    <div class="brand-header qh">
      <span>🌊 全戶軟水 — 異常情形說明</span>
      <span class="brand-badge" id="qh-badge">0</span>

    <div id="qh-list"></div>
  </div>

</div>

let currentMachine = {qs:'all', wp:'all'};

// Build pills
function buildPills(data, containerId, brand) {
  const c = document.getElementById(containerId);
  Object.keys(data).forEach(name => {
    const b = document.createElement('button');
    b.className = 'machine-pill ' + brand + '-pill';
    b.dataset.machine = name;
    b.textContent = name;
    b.onclick = function(){ filterMachine(this, brand); };
    c.appendChild(b);
  });
}
buildPills(qianshanData, 'qs-pills', 'qs');
buildPills(weipinData, 'wp-pills', 'wp');

function filterMachine(btn, brand) {
  currentMachine[brand] = btn.dataset.machine;
  document.querySelectorAll('#' + brand + '-pills .machine-pill').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  doSearch(document.getElementById('searchInput').value.trim());
}

function esc(s){ return String(s||'').replace(/[&<>"]/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[m]); }
function highlight(text, kw){
  if(!kw) return esc(text);
  const re = new RegExp(kw.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'gi');
  return esc(text).replace(re, m=>`<span class="keyword-highlight">${m}</span>`);
}

function renderRepair(items, kw, listId, showMachine, colorClass) {
  const list = document.getElementById(listId);
  if(!items.length){
    list.innerHTML = '<div class="empty-state"><div class="icon">🔍</div>無符合的維修建議</div>';
    return;
  }
  list.innerHTML = '';
  let lastGroup = null;
  items.forEach(item => {
    const groupKey = (item.machine||'') + '|' + item.category;
    if(!kw && groupKey !== lastGroup){
      lastGroup = groupKey;
      const bar = document.createElement('div');
      bar.className = 'cat-bar';
      bar.textContent = (showMachine && item.machine ? item.machine + ' ▸ ' : '') + (item.category||'');
      list.appendChild(bar);
    }
    const parts = (item.parts||'').split('\n').filter(p=>p.trim());
    const partsHtml = parts.map(p=>`<span class="part-tag">${esc(p.trim())}</span>`).join('');
    const sym = highlight((item.symptom||'').replace(/\n/g,' '), kw);
    const code = esc((item.category||'—').replace(/\n/g,' ').substring(0,20));
    const chk = highlight(item.checks||'', kw);
    const badge = (kw||showMachine) && item.machine ? `<span class="repair-machine-badge">${esc(item.machine)}</span>` : '';
    const el = document.createElement('div');
    el.className = 'repair-item';
    el.innerHTML = `
      <div class="repair-header" onclick="this.parentElement.classList.toggle('open')">
        <span class="repair-code ${colorClass}">${code}</span>
        ${badge}
        <span class="repair-symptom">${sym}</span>
        <span class="chevron">▾</span>
      </div>
      <div class="repair-body">
        <div class="repair-section">
          <div class="sec-label">📋 檢查順序項目</div>
          <div class="checks-box ${colorClass}">${chk}</div>
        </div>
        ${parts.length?`<div class="repair-section"><div class="sec-label">🔧 更換細項</div><div class="parts-wrap">${partsHtml}</div></div>`:''}
      </div>`;
    list.appendChild(el);
  });
}

function renderQuanhu(items, kw) {
  const list = document.getElementById('qh-list');
  if(!items.length){
    list.innerHTML = '<div class="empty-state"><div class="icon">🔍</div>無符合的資料</div>';
    return;
  }
  list.innerHTML = '';
  let lastCat = null;
  items.forEach(item => {
    if(item.category !== lastCat){
      lastCat = item.category;
      const bar = document.createElement('div');
      bar.className = 'cat-bar';
      bar.textContent = item.category;
      list.appendChild(bar);
    }
    const cause = highlight(item.symptom||'', kw);
    const sol = highlight(item.checks||'', kw);
    const el = document.createElement('div');
    el.className = 'quanhu-item';
    el.innerHTML = `<div class="quanhu-cause">⚠️ ${cause}</div><div class="quanhu-sol">✅ ${sol}</div>`;
    list.appendChild(el);
  });
}

function doSearch(kw) {
  const kwLow = kw.toLowerCase();

  // 千山
  const mqs = currentMachine.qs;
  const allQS = [];
  Object.entries(qianshanData).forEach(([machine, items]) => {
    if(mqs !== 'all' && machine !== mqs) return;
    items.forEach(item => allQS.push({...item, machine}));
  });
  const fqs = allQS.filter(r => !kw ||
    (r.symptom||'').toLowerCase().includes(kwLow) ||
    (r.category||'').toLowerCase().includes(kwLow) ||
    (r.checks||'').toLowerCase().includes(kwLow) ||
    (r.parts||'').toLowerCase().includes(kwLow));
  renderRepair(fqs, kw, 'qs-list', mqs==='all', 'qs');
  document.getElementById('qs-badge').textContent = fqs.length;

  // 惟品
  const mwp = currentMachine.wp;
  const allWP = [];
  Object.entries(weipinData).forEach(([machine, items]) => {
    if(mwp !== 'all' && machine !== mwp) return;
    items.forEach(item => allWP.push({...item, machine}));
  });
  const fwp = allWP.filter(r => !kw ||
    (r.symptom||'').toLowerCase().includes(kwLow) ||
    (r.category||'').toLowerCase().includes(kwLow) ||
    (r.checks||'').toLowerCase().includes(kwLow) ||
    (r.parts||'').toLowerCase().includes(kwLow));
  renderRepair(fwp, kw, 'wp-list', mwp==='all', 'wp');
  document.getElementById('wp-badge').textContent = fwp.length;

  // 全戶
  const allQH = quanhuData['全戶軟水'] || [];
  const fqh = allQH.filter(r => !kw ||
    (r.symptom||'').toLowerCase().includes(kwLow) ||
    (r.category||'').toLowerCase().includes(kwLow) ||
    (r.checks||'').toLowerCase().includes(kwLow));
  renderQuanhu(fqh, kw);
  document.getElementById('qh-badge').textContent = fqh.length;

  const total = fqs.length + fwp.length + fqh.length;
  document.getElementById('resultCount').textContent = kw
    ? `找到 ${total} 筆（千山 ${fqs.length} ／ 惟品 ${fwp.length} ／ 全戶 ${fqh.length}）`
    : `千山 ${fqs.length} 筆 ／ 惟品 ${fwp.length} 筆 ／ 全戶 ${fqh.length} 筆`;
}

document.getElementById('searchInput').addEventListener('input', e => doSearch(e.target.value.trim()));
doSearch('');
</script>
