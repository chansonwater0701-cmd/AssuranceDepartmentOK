            const col = document.createElement('div');
            col.className = 'col-12 col-md-6 col-lg-4';
            
            // 處理關鍵字高亮
            let displayTitle = item.title;
            const keyword = searchInput.value.trim();
            if(keyword) {
                const regex = new RegExp(`(${keyword})`, 'gi');
                displayTitle = displayTitle.replace(regex, '<span class="keyword-highlight">$1</span>');
            }

            col.innerHTML = `
                <div class="card video-card h-100 shadow-sm" onclick="window.open('${item.url}', '_blank')">
                    <div class="card-body d-flex align-items-center">
                        <div class="flex-grow-1">
                            <h6 class="card-title mb-0 lh-base">${displayTitle}</h6>
                            <small class="text-muted mt-2 d-block">點擊觀看影片 <i class="bi bi-play-circle-fill"></i></small>
                        </div>
                        <div class="ms-3 text-danger fs-3">
                            <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="currentColor" class="bi bi-youtube" viewBox="0 0 16 16">
                                <path d="M8.051 1.999h.089c.822.003 4.987.033 6.11.335a2.01 2.01 0 0 1 1.415 1.42c.101.38.172.883.22 1.402l.01.104.022.26.008.104c.065.914.073 1.77.074 1.957v.075c-.001.194-.01 1.108-.082 2.06l-.008.105-.009.104c-.05.572-.124 1.14-.235 1.558a2.007 2.007 0 0 1-1.415 1.42c-1.16.312-5.569.334-6.18.335h-.142c-.309 0-1.587-.006-2.927-.052l-.17-.006-.087-.004-.171-.007-.171-.007c-1.11-.049-2.167-.128-2.654-.26a2.007 2.007 0 0 1-1.415-1.42c-.314-1.16-.334-5.569-.334-6.18V6.5c0-.57.012-4.957.334-6.181a2.01 2.01 0 0 1 1.415-1.42c.487-.13 1.544-.21 2.654-.26l.17-.007.172-.006.086-.003.171-.007A99.788 99.788 0 0 1 7.858 2h.193zM6.4 5.209v4.818l4.157-2.408L6.4 5.209z"/>
                            </svg>
                        </div>
                    </div>
                </div>
            `;
            videoList.appendChild(col);
        });
    }

    // 監聽輸入事件
    searchInput.addEventListener('input', (e) => {
        const keyword = e.target.value.toLowerCase().trim();
        const filtered = videoData.filter(item => 
            item.title.toLowerCase().includes(keyword)
        );
        renderList(filtered);
    });

    // 初始渲染
    renderList(videoData);
</script>

</body>
</html>
