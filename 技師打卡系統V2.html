<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>技師維修打卡系統 V2.1</title>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    body { font-family: -apple-system, sans-serif; padding: 20px; background-color: #f4f7f6; color: #333; }
    .card { background: #fff; padding: 25px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); max-width: 400px; margin: 0 auto; }
    h2 { color: #00B900; margin-bottom: 5px; }
    #userName { font-size: 16px; color: #666; margin-bottom: 20px; }
    .upload-area { border: 2px dashed #ddd; padding: 20px; border-radius: 10px; margin-bottom: 20px; cursor: pointer; }
    button { padding: 15px; font-size: 18px; background-color: #00B900; color: white; border: none; border-radius: 8px; cursor: pointer; width: 100%; font-weight: bold; }
    button:disabled { background-color: #ccc; }
    #status { margin-top: 15px; font-size: 14px; min-height: 20px; }
    .preview { max-width: 100%; border-radius: 8px; margin-top: 15px; display: none; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    input[type="file"] { display: none; }
    label.file-label { display: block; background: #eee; padding: 10px; border-radius: 5px; margin-bottom: 10px; cursor: pointer; }
  </style>
</head>
<body>
  <div class="card">
    <h2>維修現場打卡</h2>
    <div id="userName">正在讀取技師身分...</div>
    
    <div class="upload-area" onclick="document.getElementById('photoInput').click()">
      <p style="margin:0; color:#888;">📸 點擊拍照或選擇照片</p>
      <input type="file" id="photoInput" accept="image/*" onchange="handleFile(event)">
      <img id="imagePreview" class="preview">
    </div>

    <button id="submitBtn" onclick="processUpload()" disabled>確認送出紀錄</button>
    <div id="status"></div>
  </div>

  <script>
    // 1. 設定你的 LIFF ID 與 GAS 網址
    const myLiffId = "2009667627-4eOl5qm8"; 
    // 請確認 HTML 裡的這一行網址正確
    const gasApiUrl = "https://script.google.com/macros/s/AKfycbxSgaozY02_CBmtEvlf19tfIDzSeu6w4zw78nmu91qIgO_BUnxXaWJfS4KwLfgrA5dp/exec";
    
    let profileName = "";
    let compressedBase64 = null;

    // 初始化 LIFF
    liff.init({ liffId: myLiffId }).then(() => {
      if (!liff.isLoggedIn()) {
        liff.login();
      } else {
        liff.getProfile().then(profile => {
          profileName = profile.displayName;
          document.getElementById("userName").innerText = "技師：" + profileName;
          document.getElementById("submitBtn").disabled = false;
        });
      }
    }).catch(err => {
      showStatus("❌ LIFF 初始化失敗：" + err, "red");
    });

    // 2. 處理圖片並壓縮 (核心功能)
    function handleFile(event) {
      const file = event.target.files[0];
      if (!file) return;

      showStatus("正在處理照片...", "blue");
      const reader = new FileReader();
      reader.onload = function(e) {
        const img = new Image();
        img.onload = function() {
          // --- 圖片壓縮邏輯 ---
          const canvas = document.createElement('canvas');
          let width = img.width;
          let height = img.height;
          const max_size = 1024; // 最大寬度

          if (width > height) {
            if (width > max_size) { height *= max_size / width; width = max_size; }
          } else {
            if (height > max_size) { width *= max_size / height; height = max_size; }
          }
          canvas.width = width;
          canvas.height = height;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, width, height);
          
          // 轉成 Base64，品質設定 0.8
          compressedBase64 = canvas.toDataURL('image/jpeg', 0.8);
          
          const preview = document.getElementById("imagePreview");
          preview.src = compressedBase64;
          preview.style.display = "block";
          showStatus("照片已就緒", "green");
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    }

    // 3. 執行送出
    function processUpload() {
      const btn = document.getElementById("submitBtn");
      btn.disabled = true;
      btn.innerText = "上傳中...";
      showStatus("正在存入雲端與試算表...", "orange");

      const payload = {
        name: profileName,
        imageB64: compressedBase64, // 這已經是壓縮過的
        timestamp: new Date().toLocaleString('zh-TW', { timeZone: 'Asia/Taipei' })
      };

      fetch(gasApiUrl, {
        method: 'POST',
        body: JSON.stringify(payload)
      })
      .then(res => res.json())
      .then(result => {
        if(result.status === "success") {
          showStatus("✅ 打卡成功！視窗即將關閉", "green");
          setTimeout(() => { liff.closeWindow(); }, 2500);
        } else {
          throw new Error(result.message);
        }
      })
      .catch(error => {
        showStatus("❌ 失敗：" + error.message, "red");
        btn.disabled = false;
        btn.innerText = "重新送出";
      });
    }

    function showStatus(msg, color) {
      const s = document.getElementById("status");
      s.innerText = msg;
      s.style.color = color;
    }
  </script>
</body>
</html>
