            --border: #dde3ed;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --warning-bg: #fffbeb;
            --warning-border: #fcd34d;
            --warning-text: #92400e;
        }
        * { box-sizing: border-box; }
        body {

            color: var(--text-main);
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            margin: 0;
        }

        /* ── STICKY HEADER ── */
        .site-header {
            background: linear-gradient(135deg, #1e3a8a 0%, #1a56db 100%);
            color: white;
            padding: 16px 20px 14px;
            position: sticky;
            top: 0;
            z-index: 1000;
            box-shadow: 0 2px 16px rgba(30,58,138,0.35);
        }
        .header-top {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 12px;
        }
        .site-header h1 {
            font-size: 1.3rem;
            font-weight: 800;
            margin: 0;
            letter-spacing: -0.02em;
        }
        .site-header .subtitle {
            font-size: 0.78rem;
            opacity: 0.7;
            margin-top: 2px;
        }
        .search-wrap {
            position: relative;
        }
        .search-wrap input {
            width: 100%;
            padding: 11px 16px 11px 42px;
            border-radius: 12px;
            border: 2px solid rgba(255,255,255,0.25);
            background: rgba(255,255,255,0.15);
            color: white;
            font-size: 1rem;
            outline: none;
            transition: background 0.2s, border-color 0.2s;
        }
        .search-wrap input::placeholder { color: rgba(255,255,255,0.6); }
        .search-wrap input:focus {
            background: rgba(255,255,255,0.22);
            border-color: rgba(255,255,255,0.55);
        }
        .search-icon {
            position: absolute;
            left: 13px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 1.1rem;
            opacity: 0.75;
            pointer-events: none;
        }
        .result-count {
            margin-top: 7px;
            font-size: 0.8rem;
            opacity: 0.8;
            min-height: 18px;
        }

        /* ── CONTENT ── */
        .content-wrap {
            max-width: 900px;
            margin: 0 auto;
            padding: 20px 16px 40px;
        }

        /* ── SECTION DIVIDER ── */
        .section-divider {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 24px 0 14px;
        }
        .section-divider h2 {
            font-size: 1rem;
            font-weight: 700;
            color: var(--primary);
            margin: 0;
            white-space: nowrap;
        }
        .section-divider hr {
            flex: 1;
            border: none;
            border-top: 2px solid var(--border);
            margin: 0;
        }
        .section-badge {
            background: var(--primary);
            color: white;
            font-size: 0.72rem;
            font-weight: 700;
            padding: 2px 8px;
            border-radius: 10px;
        }

        /* ── VIDEO CARDS ── */
        .video-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        @media (max-width: 600px) { .video-grid { grid-template-columns: 1fr; } }

        .video-card {
            background: white;
            border: 1.5px solid var(--border);
            border-radius: 12px;
            padding: 12px 14px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 12px;
            transition: transform 0.15s, box-shadow 0.15s, border-color 0.15s;
        }
        .video-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 18px rgba(26,86,219,0.12);
            border-color: var(--primary);
        }
        .video-card-title {
            font-size: 0.88rem;
            font-weight: 600;
            flex: 1;
            line-height: 1.45;
        }
        .video-card-sub {
            font-size: 0.73rem;
            color: var(--text-muted);
            margin-top: 3px;
        }
        .yt-icon { color: #dc2626; flex-shrink: 0; }
        .keyword-highlight { color: var(--accent); font-weight: 700; }

        /* ── MACHINE FILTER PILLS ── */
        .machine-pills {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-bottom: 14px;
        }
        .machine-pill {
            padding: 5px 13px;
            border-radius: 20px;
            border: 1.5px solid var(--border);
            background: white;
            font-size: 0.82rem;
            font-weight: 600;
            cursor: pointer;
            color: var(--text-muted);
            transition: all 0.15s;
        }
        .machine-pill.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }
        .machine-pill:hover:not(.active) {
            border-color: var(--primary);
            color: var(--primary);
        }

        /* ── REPAIR ITEMS ── */
        .repair-item {
            background: white;
            border: 1.5px solid var(--border);
            border-radius: 12px;
            margin-bottom: 8px;
            overflow: hidden;
            transition: box-shadow 0.15s;
        }
        .repair-item:hover { box-shadow: 0 3px 12px rgba(0,0,0,0.08); }

        .repair-header {
            display: flex;
            align-items: center;
            padding: 12px 14px;
            cursor: pointer;
            gap: 10px;
            user-select: none;
        }
        .repair-code {
            background: var(--primary);
            color: white;
            font-size: 0.78rem;
            font-weight: 700;
            padding: 3px 9px;
            border-radius: 6px;
            white-space: nowrap;
            min-width: 46px;
            text-align: center;
            flex-shrink: 0;
        }
        .repair-machine-badge {
            background: #e0e7ff;
            color: #3730a3;
            font-size: 0.72rem;
            font-weight: 700;
            padding: 2px 7px;
            border-radius: 5px;
            flex-shrink: 0;
        }
        .repair-symptom {
            flex: 1;
            font-weight: 600;
            font-size: 0.9rem;
            line-height: 1.35;
        }
        .chevron {
            color: var(--text-muted);
            font-size: 1rem;
            transition: transform 0.2s;
            flex-shrink: 0;
        }
        .repair-item.open .chevron { transform: rotate(180deg); }

        .repair-body {
            display: none;
            border-top: 1.5px solid var(--border);
        }
        .repair-item.open .repair-body { display: block; }

        .repair-section {
            padding: 12px 14px;
            border-bottom: 1px solid var(--border);
        }
        .repair-section:last-child { border-bottom: none; }

        .sec-label {
            font-size: 0.72rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.07em;
            color: var(--text-muted);
            margin-bottom: 8px;
        }
        .checks-box {
            font-size: 0.85rem;
            line-height: 1.75;
            white-space: pre-wrap;
            background: #f8fafc;
            border-left: 3px solid var(--primary);
            border-radius: 0 8px 8px 0;
            padding: 10px 12px;
            color: var(--text-main);
        }
        .parts-wrap { display: flex; flex-wrap: wrap; gap: 6px; }
        .part-tag {
            background: var(--warning-bg);
            color: var(--warning-text);
            border: 1px solid var(--warning-border);
            font-size: 0.8rem;
            font-weight: 600;
            padding: 3px 10px;

            color: var(--text-muted);

    const allRepair = [];
Object.entries(repairData).forEach(([machine, items]) => {
    items.forEach(item => {
        allRepair.push({ ...item, machine });
    });
});

let currentMachine = 'all';

// Build machine pill buttons
const pillsContainer = document.getElementById('machinePills');
Object.keys(repairData).forEach(name => {
    const btn = document.createElement('button');
    btn.className = 'machine-pill';
    btn.dataset.machine = name;
    btn.textContent = name;
    btn.onclick = function() { filterMachine(this); };
    pillsContainer.appendChild(btn);
});

function filterMachine(btn) {
    currentMachine = btn.dataset.machine;
    document.querySelectorAll('.machine-pill').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    doSearch(document.getElementById('searchInput').value.trim());
}

function esc(str) {
    return str.replace(/[&<>"]/g, m => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' })[m]);
}

function highlight(text, kw) {
    if (!kw) return esc(text);
    const escaped = kw.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    return esc(text).replace(new RegExp(escaped.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'gi'),
        m => `<span class="keyword-highlight">${m}</span>`);
}

function doSearch(kw) {
    const kwLow = kw.toLowerCase();

    // Filter videos
    const filteredVideos = videoData.filter(v => !kw || v.title.toLowerCase().includes(kwLow));

    // Filter repair
    const filteredRepair = allRepair.filter(r => {
        const machineOk = currentMachine === 'all' || r.machine === currentMachine;
        if (!machineOk) return false;
        if (!kw) return true;
        return r.symptom.toLowerCase().includes(kwLow) ||
               r.category.toLowerCase().includes(kwLow) ||
               r.checks.toLowerCase().includes(kwLow) ||
               r.parts.toLowerCase().includes(kwLow) ||
               r.machine.toLowerCase().includes(kwLow);
    });

    renderVideos(filteredVideos, kw);
    renderRepair(filteredRepair, kw);

    const total = filteredVideos.length + filteredRepair.length;
    document.getElementById('resultCount').textContent = kw
        ? `找到 ${total} 筆（影片 ${filteredVideos.length} 筆 ＋ 維修建議 ${filteredRepair.length} 筆）`
        : `影片 ${filteredVideos.length} 筆 ／ 維修建議 ${filteredRepair.length} 筆`;
    document.getElementById('videoBadge').textContent = filteredVideos.length;
    document.getElementById('repairBadge').textContent = filteredRepair.length;
}

function renderVideos(items, kw) {
    const list = document.getElementById('videoList');
    if (items.length === 0) {
        list.innerHTML = '<div class="empty-state" style="grid-column:1/-1"><div class="icon">🎬</div>無符合的影片</div>';
        return;
    }
    list.innerHTML = '';
    items.forEach(item => {
        const title = kw ? highlight(item.title, kw) : esc(item.title);
        const card = document.createElement('div');
        card.className = 'video-card';
        card.onclick = () => window.open(item.url, '_blank');
        card.innerHTML = `
            <div class="flex-grow-1">
                <div class="video-card-title">${title}</div>
                <div class="video-card-sub">點擊觀看 ▶</div>
            </div>
            <svg class="yt-icon" xmlns="http://www.w3.org/2000/svg" width="28" height="28" fill="currentColor" viewBox="0 0 16 16">
                <path d="M8.051 1.999h.089c.822.003 4.987.033 6.11.335a2.01 2.01 0 0 1 1.415 1.42c.101.38.172.883.22 1.402l.01.104.022.26.008.104c.065.914.073 1.77.074 1.957v.075c-.001.194-.01 1.108-.082 2.06l-.008.105-.009.104c-.05.572-.124 1.14-.235 1.558a2.007 2.007 0 0 1-1.415 1.42c-1.16.312-5.569.334-6.18.335h-.142c-.309 0-1.587-.006-2.927-.052l-.17-.006-.087-.004-.171-.007-.171-.007c-1.11-.049-2.167-.128-2.654-.26a2.007 2.007 0 0 1-1.415-1.42c-.314-1.16-.334-5.569-.334-6.18V6.5c0-.57.012-4.957.334-6.181a2.01 2.01 0 0 1 1.415-1.42c.487-.13 1.544-.21 2.654-.26l.17-.007.172-.006.086-.003.171-.007A99.788 99.788 0 0 1 7.858 2h.193zM6.4 5.209v4.818l4.157-2.408L6.4 5.209z"/>
            </svg>`;
        list.appendChild(card);
    });
}

function renderRepair(items, kw) {
    const list = document.getElementById('repairList');
    if (items.length === 0) {
        list.innerHTML = '<div class="empty-state"><div class="icon">🔩</div>無符合的維修建議</div>';
        return;
    }
    list.innerHTML = '';
    let lastGroup = null;

    items.forEach((item) => {
        const groupKey = item.machine + '|' + item.category;

        // Show category bar when not searching (grouped view)
        if (!kw && groupKey !== lastGroup) {
            lastGroup = groupKey;
            const bar = document.createElement('div');
            bar.className = 'cat-bar';
            bar.textContent = (currentMachine === 'all' ? item.machine + ' ▸ ' : '') + item.category;
            list.appendChild(bar);
        }

        const parts = item.parts.split('\n').filter(p => p.trim());
        const partsHtml = parts.map(p => `<span class="part-tag">${esc(p.trim())}</span>`).join('');
        const symptomDisplay = kw ? highlight(item.symptom.replace(/\n/g,' '), kw) : esc(item.symptom.replace(/\n/g,' '));
        const codeLabel = item.category && item.category !== item.symptom ? item.category.replace(/\n/g,' ') : '—';
        const checksDisplay = kw ? highlight(item.checks, kw) : esc(item.checks);

        const el = document.createElement('div');
        el.className = 'repair-item';

        // In search mode or all-machine mode, show machine badge
        const machineBadge = (kw || currentMachine === 'all') ?
            `<span class="repair-machine-badge">${esc(item.machine)}</span>` : '';

        el.innerHTML = `
            <div class="repair-header" onclick="this.parentElement.classList.toggle('open')">
                <span class="repair-code">${esc(codeLabel)}</span>
                ${machineBadge}
                <span class="repair-symptom">${symptomDisplay}</span>
                <span class="chevron">▾</span>
            </div>
            <div class="repair-body">
                <div class="repair-section">
                    <div class="sec-label">📋 檢查順序項目</div>
                    <div class="checks-box">${checksDisplay}</div>
                </div>
                ${parts.length ? `
                <div class="repair-section">
                    <div class="sec-label">🔧 更換細項</div>
                    <div class="parts-wrap">${partsHtml}</div>
                </div>` : ''}
            </div>`;
        list.appendChild(el);
    });
}

// Search listener
document.getElementById('searchInput').addEventListener('input', e => {
    doSearch(e.target.value.trim());
});

// Init
doSearch('');
</script>
